 {tab==='Juegos'&&<div><div className="flex flex-wrap items-end justify-between gap-4 mb-5"><div><h1 className="text-2xl font-extrabold">Mini-juegos de descanso</h1><p className="muted mt-1 text-sm">Elegí un juego, despejá la mente y ganá XP al completar una partida.</p></div><span className="pill text-cyan-300">Cada partida completada: +15 XP</span></div><div className="flex flex-wrap gap-2 mb-5">{['Memory Cards','Reflex Test','Speed Math','Simon Says','Word Scramble'].map(g=><button key={g} onClick={()=>{setGame(g);setGameXp(false);if(g==='Memory Cards')initMemory();if(g==='Speed Math')startMath();if(g==='Simon Says')startSimon();if(g==='Word Scramble'){setScrambleIdx(0);setScrambleInput('');setScrambleScore(0);setScrambleDone(false);setScrambledWords(words.map(scrambled))}if(g==='Reflex Test'){setRefState('idle');setRefResult(null)}}} className={'tab '+(game===g?'active':'')}>{g}</button>)}</div><div className="glass rounded-3xl p-5 md:p-7"><div className="flex justify-between items-start gap-3 mb-5"><div><h2 className="text-xl font-extrabold">{game}</h2><p className="muted text-sm mt-1">{game==='Memory Cards'?'Encontrá los 8 pares de cartas.':game==='Reflex Test'?'Esperá a que aparezca el verde y reaccioná.':game==='Speed Math'?'Resolvé 10 operaciones antes de que se acabe el reto.':game==='Simon Says'?'Memorizá y repetí la secuencia de colores.':'Ordená las letras para descubrir materias escolares.'}</p></div>{gameXp&&<span className="pill text-green-300">✓ +15 XP ganado</span>}</div>

 {game==='Reflex Test'&&<><button onClick={clickReflex} className="w-full max-w-2xl mx-auto block rounded-2xl min-h-56 text-xl md:text-2xl font-extrabold btn" style={{background:refState==='go'?'#16a34a':refState==='wait'?'#b45309':refState==='early'?'#7f1d1d':'#102238',border:'1px solid #334155'}}>{refState==='go'?'¡AHORA! ¡CLIC!':refState==='wait'?'Espera al verde…':refState==='early'?'¡Demasiado pronto!':'Pulsa iniciar y preparate'}</button><div className="text-center mt-4"><button onClick={startReflex} className="btn primary rounded-xl px-5 py-2">Iniciar prueba</button><p className="mt-3 text-cyan-300 font-bold">{refResult||''}</p></div></>}
 {game==='Speed Math'&&<div className="max-w-xl mx-auto text-center">{!mathQs.length?<button onClick={startMath} className="btn primary rounded-xl px-5 py-3">Comenzar 10 operaciones</button>:mathEnd?<><div className="text-4xl">🎉</div><h3 className="text-2xl font-bold mt-3">¡Reto terminado!</h3><p className="muted mt-2">Respuestas correctas: {mathScore}/10</p><button onClick={startMath} className="btn primary rounded-xl px-5 py-2 mt-4">Jugar otra vez</button></>:<><div className="muted text-sm">Operación {mathIdx+1} de 10</div><div className="text-5xl font-extrabold my-8">{mathQs[mathIdx].q} = ?</div><form onSubmit={e=>{e.preventDefault();answerMath()}} className="flex gap-2 justify-center"><input autoFocus className="field !w-32 text-center text-xl" value={mathAns} onChange={e=>setMathAns(e.target.value)} type="number" required/><button className="btn primary rounded-xl px-5">Responder</button></form><div className="muted text-sm mt-4">Aciertos: {mathScore}</div></>}</div>}
 {game==='Simon Says'&&<div className="max-w-md mx-auto text-center"><p className="muted mb-4">{simonMsg}</p><div className="grid grid-cols-2 gap-3">{[{id:'cyan',c:'#06b6d4'},{id:'pink',c:'#e879f9'},{id:'blue',c:'#3b82f6'},{id:'lime',c:'#84cc16'}].map(o=><button key={o.id} onClick={()=>clickSimon(o.id)} className="h-24 rounded-2xl border border-white/10 btn" style={{background:o.c,boxShadow:`0 0 18px ${o.c}30`}} aria-label={o.id}/>)}</div><div className="text-sm muted mt-4">Colores correctos: {simonUser.length}/4</div><button onClick={startSimon} className="btn primary rounded-xl px-5 py-2 mt-4">Nueva secuencia</button></div>}
 {game==='Word Scramble'&&<div className="max-w-xl mx-auto text-center">{scrambleDone?<><div className="text-4xl">🏆</div><h3 className="text-2xl font-bold mt-3">¡Completaste las 10 palabras!</h3><button onClick={()=>{setScrambleIdx(0);setScrambleInput('');setScrambleScore(0);setScrambleDone(false);setScrambledWords(words.map(scrambled));setGameXp(false)}} className="btn primary rounded-xl px-5 py-2 mt-4">Jugar otra vez</button></>:<><div className="muted text-sm">Palabra {scrambleIdx+1} de 10</div><div className="text-4xl md:text-5xl tracking-[.2em] font-extrabold text-cyan-300 my-8">{scrambledWords[scrambleIdx]}</div><form onSubmit={e=>{e.preventDefault();checkWord()}} className="flex gap-2"><input className="field text-center uppercase" value={scrambleInput} onChange={e=>setScrambleInput(e.target.value)} placeholder="Escribí la palabra correcta" required/><button className="btn primary rounded-xl px-5">Comprobar</button></form><p className="muted text-sm mt-3">Correctas: {scrambleScore}/10</p></>}</div>}
 </div></div>}
 {tab==='Modo examen'&&<div className="max-w-4xl mx-auto"><div className="glass rounded-3xl p-6 md:p-8"><div className="flex items-center gap-4"><div className="w-14 h-14 rounded-2xl bg-cyan-950 flex items-center justify-center text-3xl">📝</div><div><h1 className="text-2xl font-extrabold">MODO EXAMEN</h1><p className="muted text-sm">Practicá con preguntas de ejemplo y revisá tus resultados.</p></div></div>{!examStarted?<div className="grid md:grid-cols-2 gap-4 mt-7"><label className="text-sm muted">Materia<select className="field mt-2" value={examSubject} onChange={e=>setExamSubject(e.target.value)}>{subjects.map(s=><option key={s}>{s}</option>)}</select></label><label className="text-sm muted">Cantidad de preguntas<select className="field mt-2" value={examCount} onChange={e=>setExamCount(+e.target.value)}>{[10,15,20,25].map(n=><option key={n} value={n}>{n} preguntas</option>)}</select></label><div className="md:col-span-2 rounded-2xl border border-cyan-900/50 bg-cyan-950/20 p-4 text-sm"><div className="font-bold text-cyan-200">¿Cómo funciona?</div><p className="muted mt-1">Preguntas de opción múltiple, corrección al terminar y +100 XP por completar el examen. Las preguntas se seleccionan aleatoriamente de un banco de práctica.</p></div><button onClick={startExam} className="btn primary rounded-xl px-6 py-4 md:col-span-2 text-lg">Comenzar examen →</button></div>:examDone?<div className="mt-7"><div className="text-center rounded-2xl bg-cyan-950/30 border border-cyan-900/40 p-7"><div className="text-5xl">🏅</div><div className="text-4xl font-extrabold mt-3">{examQuestions.filter((q,i)=>examAnswers[i]===q[2]).length}/{examQuestions.length}</div><h2 className="text-xl font-bold mt-2">Examen finalizado</h2><p className="muted mt-2">Puntaje: {Math.round(examQuestions.filter((q,i)=>examAnswers[i]===q[2]).length/examQuestions.length*100)}% · +100 XP</p><button onClick={()=>{setExamStarted(false);setExamDone(false)}} className="btn primary rounded-xl px-5 py-2 mt-4">Volver a configurar</button></div><h3 className="font-bold text-lg mt-6 mb-3">Corrección pregunta por pregunta</h3><div className="space-y-3">{examQuestions.map((q,i)=><div key={i} className="gamecard"><div className="font-bold">{i+1}. {q[0]}</div><div className="text-sm mt-2">Tu respuesta: <span className={examAnswers[i]===q[2]?'text-green-300':'text-red-300'}>{examAnswers[i]||'Sin responder'}</span></div>{examAnswers[i]!==q[2]&&<div className="text-sm text-cyan-300 mt-1">Correcta: {q[2]}</div>}</div>)}</div></div>:<div className="mt-7"><div className="flex justify-between text-sm muted"><span>{examSubject}</span><span>Pregunta {examIndex+1} de {examQuestions.length}</span></div><div className="progress mt-3"><div style={{width:((examIndex+1)/examQuestions.length*100)+'%'}}/></div><h2 className="text-xl md:text-2xl font-bold mt-7">{examQuestions[examIndex]?.[0]}</h2><div className="grid gap-3 mt-5">{examQuestions[examIndex]?.[1].map((o,i)=><button key={i} onClick={()=>setExamAnswers({...examAnswers,[examIndex]:o})} className={'text-left p-4 rounded-xl border '+(examAnswers[examIndex]===o?'border-cyan-400 bg-cyan-950/40':'border-slate-700 bg-[#0b1728]')}>{String.fromCharCode(65+i)}. {o}</button>)}</div><div className="flex justify-between gap-3 mt-6"><button disabled={examIndex===0} onClick={()=>setExamIndex(i=>i-1)} className="btn rounded-xl border border-slate-600 px-4 py-2 disabled:opacity-30">← Anterior</button>{examIndex<examQuestions.length-1?<button onClick={()=>setExamIndex(i=>i+1)} className="btn primary rounded-xl px-5 py-2">Siguiente →</button>:<button onClick={finishExam} className="btn primary rounded-xl px-5 py-2">Finalizar y corregir</button>}</div><p className="muted text-xs mt-4">Podés avanzar sin responder, pero las preguntas en blanco cuentan como incorrectas.</p></div>}</div></div>}
 {tab==='Calendario'&&<div className="grid lg:grid-cols-[1.2fr_.8fr] gap-5"><section className="glass rounded-3xl p-5 md:p-7"><div className="flex items-center justify-between gap-3"><div><h1 className="text-2xl font-extrabold">Calendario</h1><p className="muted text-sm mt-1">Organizá exámenes, entregas y fechas importantes.</p></div><div className="flex gap-2"><button className="pill" onClick={()=>{if(month===0){setMonth(11);setYear(year-1)}else setMonth(month-1)}}>←</button><button className="pill" onClick={()=>{if(month===11){setMonth(0);setYear(year+1)}else setMonth(month+1)}}>→</button></div></div><div className="text-xl font-bold mt-6 mb-3">{new Date(year,month,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</div><div className="grid grid-cols-7 gap-1">{['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=><div key={d} className="text-center text-xs muted py-2">{d}</div>)}{Array.from({length:offset},(_,i)=><div key={'empty'+i} />)}{Array.from({length:daysInMonth},(_,i)=>{let d=String(year)+'-'+fmt(month+1)+'-'+fmt(i+1);return <button key={d} onClick={()=>{setSelectedDate(d);setEventDate(d)}} className={'day text-left '+(d===selectedDate?'selected':'')+(d===new Date().toISOString().slice(0,10)?' today':'')}><div className="daynum">{i+1}</div>{eventsFor(d).slice(0,2).map(e=><div key={e.id} className="mt-1 text-[9px] rounded bg-cyan-900/70 text-cyan-100 px-1 truncate">{e.title}</div>)}{eventsFor(d).length>2&&<div className="text-[9px] text-cyan-300">+ más</div>}</button>})}</div></section><aside className="glass rounded-3xl p-5 md:p-7"><h2 className="text-xl font-bold">Agregar evento</h2><p className="muted text-sm mt-1">Elegí un título y una fecha límite.</p><label className="block text-sm muted mt-5">Título<input className="field mt-2" value={eventTitle} onChange={e=>setEventTitle(e.target.value)} placeholder="Ej. Evaluación de Matemática"/></label><label className="block text-sm muted mt-4">Fecha límite<input type="date" className="field mt-2" value={eventDate} onChange={e=>setEventDate(e.target.value)}/></label><button onClick={addEvent} className="btn primary rounded-xl w-full py-3 mt-4">+ Guardar evento</button><div className="divider mt-6"/><h3 className="font-bold mt-6">Eventos del {selectedDate}</h3><div className="space-y-2 mt-3">{eventsFor(selectedDate).length?eventsFor(selectedDate).map(e=><div key={e.id} className="gamecard flex justify-between gap-2 items-center"><div><div className="font-semibold">{e.title}</div><div className="muted text-xs">Fecha límite: {e.date}</div></div><button onClick={()=>setEvents(events.filter(x=>x.id!==e.id))} className="text-red-300 text-xs">Eliminar</button></div>):<p className="muted text-sm">No hay eventos para esta fecha.</p>}</div><h3 className="font-bold mt-6">Próximos eventos</h3><div className="space-y-2 mt-3">{[...events].sort((a,b)=>a.date.localeCompare(b.date)).filter(e=>e.date>=new Date().toISOString().slice(0,10)).slice(0,4).map(e=><div key={e.id} className="flex justify-between gap-3 text-sm border-b border-slate-800 pb-2"><span>{e.title}</span><span className="muted whitespace-nowrap">{e.date}</span></div>)}</div></aside></div>}
 {tab==='Tareas'&&<div className="max-w-4xl mx-auto"><section className="glass rounded-3xl p-6 md:p-8"><h1 className="text-2xl font-extrabold">Mis tareas</h1><p className="muted mt-1 text-sm">Anotá lo que tenés que hacer y ganá XP al completarlo.</p><form onSubmit={e=>{e.preventDefault();addTask()}} className="flex gap-2 mt-6"><input className="field" value={taskText} onChange={e=>setTaskText(e.target.value)} placeholder="Ej. Terminar carpeta de Historia"/><button className="btn primary rounded-xl px-5">Agregar</button></form><div className="flex justify-between muted text-sm mt-6"><span>{tasks.filter(t=>t.done).length} de {tasks.length} completadas</span><span>{tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0}%</span></div><div className="progress mt-2"><div style={{width:(tasks.length?tasks.filter(t=>t.done).length/tasks.length*100:0)+'%'}}/></div><div className="space-y-3 mt-5">{tasks.map(t=><div key={t.id} className="gamecard flex gap-3 items-center"><input type="checkbox" checked={t.done} onChange={e=>{setTasks(tasks.map(x=>x.id===t.id?{...x,done:e.target.checked}:x));if(e.target.checked&&!t.done)addXP(10);if(!e.target.checked&&t.done)addXP(-10)}} className="w-5 h-5 accent-cyan-400"/><span className={'flex-1 '+(t.done?'line-through muted':'')}>{t.text}</span><span className="pill">{t.done?'+10 XP':'10 XP'}</span><button onClick={()=>setTasks(tasks.filter(x=>x.id!==t.id))} className="text-red-300 text-xs">✕</button></div>)}{!tasks.length&&<div className="text-center muted py-10">Todavía no hay tareas. Agregá la primera arriba.</div>}</div></section></div>}
 {tab==='Estadísticas'&&<div className="space-y-5"><section className="glass rounded-3xl p-6"><h1 className="text-2xl font-extrabold">Estadísticas de concentración</h1><p className="muted mt-1">Revisá tus sesiones y cómo evoluciona tu enfoque durante la semana.</p><div className="grid sm:grid-cols-3 gap-3 mt-5"><div className="gamecard"><div className="text-3xl font-extrabold text-cyan-300">{sessionHistory.length}</div><div className="muted text-sm mt-1">Sesiones completadas</div></div><div className="gamecard"><div className="text-3xl font-extrabold text-cyan-300">{sessionHistory.reduce((a,x)=>a+(x.minutes||studyMin),0)}</div><div className="muted text-sm mt-1">Minutos de estudio</div></div><div className="gamecard"><div className="text-3xl font-extrabold text-cyan-300">🔥 {streak}</div><div className="muted text-sm mt-1">Días de racha</div></div></div></section><section className="glass rounded-3xl p-6"><h2 className="text-xl font-bold">Evolución semanal de concentración</h2><p className="muted text-sm mt-1">Promedio de estrellas por día (de 5). Completá la valoración al terminar cada sesión.</p><div className="grid grid-cols-7 gap-2 mt-6 items-end">{weeklyStats.map(d=><div key={d.key} className="text-center"><div className="h-36 rounded-xl bg-slate-800/80 flex items-end overflow-hidden"><div title={`${d.avg}/5 estrellas`} className="w-full rounded-t-lg bg-gradient-to-t from-sky-600 to-cyan-300" style={{height:(d.avg/5*100)+'%'}}/></div><div className="text-xs font-bold mt-2">{d.label}</div><div className="text-[10px] muted">{d.count} ses.</div><div className="text-[10px] text-cyan-300">{d.avg}/5</div></div>)}</div></section><section className="glass rounded-3xl p-6"><h2 className="text-xl font-bold">Historial de sesiones</h2><div className="space-y-2 mt-4">{[...sessionHistory].reverse().slice(0,20).map((x,i)=><div key={x.id} className="gamecard flex flex-wrap items-center justify-between gap-2"><div><div className="font-semibold">Sesión de {x.minutes} minutos</div><div className="muted text-xs">{x.date} · Concentración: {x.focus||'Sin valorar'}</div></div><div className="text-yellow-300">{'★'.repeat(x.rating||0)}<span className="text-slate-600">{'★'.repeat(5-(x.rating||0))}</span></div></div>)}{!sessionHistory.length&&<p className="muted text-sm">Todavía no hay sesiones registradas. Completá tu primer Pomodoro para empezar.</p>}</div></section></div>}
 {reviewOpen&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div className="glass glow rounded-3xl p-6 md:p-8 max-w-lg w-full border border-cyan-500/40"><div className="text-4xl text-center">🎯</div><h2 className="text-2xl font-extrabold text-center mt-3">¿Cómo estuvo tu concentración?</h2><p className="muted text-center text-sm mt-2">Terminaste una sesión. Elegí de 1 a 5 estrellas según cómo te fue.</p><div className="flex justify-center gap-2 mt-6">{[1,2,3,4,5].map(n=><button key={n} onClick={()=>{setSessionRating(n);setSessionFocus(n>=3?'Sí':'No')}} aria-label={`${n} estrellas`} className={'text-4xl transition '+(sessionRating>=n?'text-yellow-300':'text-slate-600')}>★</button>)}</div><div className="text-center text-sm mt-2">{sessionRating===5?'¡Concentración excelente!':sessionRating===4?'¡Muy buen enfoque!':sessionRating===3?'Estuvo bastante bien.':sessionRating===2?'Hubo varias distracciones.':sessionRating===1?'Costó mantener el enfoque.':'Elegí tu puntuación'}</div><div className="mt-5"><label className="text-sm muted">¿Sentís que estuviste concentrado?</label><div className="grid grid-cols-2 gap-3 mt-2"><button onClick={()=>setSessionFocus('Sí')} className={'btn rounded-xl py-3 '+(sessionFocus==='Sí'?'primary':'border border-slate-700')}>✓ Sí, estuve concentrado</button><button onClick={()=>setSessionFocus('No')} className={'btn rounded-xl py-3 '+(sessionFocus==='No'?'primary':'border border-slate-700')}>↻ No, me distraje</button></div></div>{sessionRating>0&&<div className="rounded-2xl bg-cyan-950/30 border border-cyan-900/50 p-4 mt-5"><div className="font-bold text-cyan-200">Ideas para tu próxima sesión</div><ul className="list-disc pl-5 text-sm muted mt-2 space-y-1">{(sessionRating>=4?['Repetí las condiciones que te ayudaron a concentrarte.','Dejá preparada la próxima tarea antes de empezar.','Mantené el celular fuera del alcance.']:['Poné el celular en silencio y dejalo lejos durante 25 minutos.','Cerrá las pestañas y aplicaciones que no necesitás.','Escribí una meta pequeña y concreta para esta sesión.','Si te distraés, anotá la distracción y volvé a la tarea sin castigarte.']).map(t=><li key={t}>{t}</li>)}</ul></div>}<button disabled={!sessionRating} onClick={saveSessionReview} className="btn primary rounded-xl w-full py-3 mt-5 disabled:opacity-40">Guardar valoración</button></div></div>}
 <footer className="text-center muted text-xs py-10">FocusUp · Tu progreso se guarda en este navegador · Estudiá a tu ritmo ✦</footer></main></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
